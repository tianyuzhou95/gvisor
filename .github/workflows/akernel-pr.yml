name: AKernel gVisor PR build

"on":
  pull_request:
    branches:
      - develop

concurrency:
  group: akernel-gvisor-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release archive (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo -E apt-get update
        sudo -E apt-get install -y binutils bzip2 make

    - name: Build and verify release archive
      shell: bash
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        set -euo pipefail
        bash tools/akernel-release-archive.sh build "${ARCH}" "${RUNNER_TEMP}/gvisor-pr"
