name: AKernel gVisor candidate

run-name: Build candidate ${{ inputs.release_tag }}

"on":
  workflow_dispatch:
    inputs:
      release_tag:
        description: Planned AKernel gVisor release tag
        required: true
        type: string

concurrency:
  group: akernel-gvisor-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == 'develop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Validate candidate
      id: candidate
      shell: bash
      run: |
        set -euo pipefail

        if [[ ! "${RELEASE_TAG}" =~ ^release-[0-9]{8}\.[0-9]+-akernel\.[1-9][0-9]*$ ]]; then
          echo "invalid release tag: ${RELEASE_TAG}" >&2
          exit 1
        fi

        upstream_tag="${RELEASE_TAG%-akernel.*}"
        git fetch --force --no-tags https://github.com/google/gvisor.git \
          "refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"
        git merge-base --is-ancestor "${upstream_tag}" "${GITHUB_SHA}"

        if git ls-remote --exit-code --tags origin \
          "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
          echo "release tag already exists: ${RELEASE_TAG}" >&2
          exit 1
        fi

        echo "upstream_tag=${upstream_tag}" >>"${GITHUB_OUTPUT}"

    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo -E apt-get update
        sudo -E apt-get install -y binutils bzip2 make

    - name: Build release tarball
      shell: bash
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        set -euo pipefail
        bash tools/akernel-release-archive.sh build "${ARCH}" "${RUNNER_TEMP}/gvisor-candidate"

    - name: Upload architecture candidate
      uses: actions/upload-artifact@v4
      with:
        name: gvisor-candidate-${{ github.run_id }}-${{ matrix.arch }}
        path: |
          ${{ runner.temp }}/gvisor-candidate/gvisor-${{ matrix.arch }}.tar.bz2
          ${{ runner.temp }}/gvisor-candidate/gvisor-${{ matrix.arch }}.tar.bz2.sha512
        if-no-files-found: error
        compression-level: 0
        overwrite: true
        retention-days: 30

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Download architecture candidates
      uses: actions/download-artifact@v5
      with:
        pattern: gvisor-candidate-${{ github.run_id }}-*
        path: ${{ runner.temp }}/gvisor-candidate

    - name: Verify and describe candidate
      shell: bash
      run: |
        set -euo pipefail
        candidate_dir="${RUNNER_TEMP}/gvisor-candidate"
        for arch in amd64 arm64; do
          asset_dir="${candidate_dir}/gvisor-candidate-${GITHUB_RUN_ID}-${arch}"
          archive="${asset_dir}/gvisor-${arch}.tar.bz2"
          test -f "${archive}"
          bash tools/akernel-release-archive.sh verify "${arch}" "${archive}"
          archive_sha512="$(sha512sum "${archive}" | cut -d ' ' -f 1)"
          cmp -s <(printf '%s  %s\n' "${archive_sha512}" "gvisor-${arch}.tar.bz2") \
            "${asset_dir}/gvisor-${arch}.tar.bz2.sha512"
          mv "${archive}" "${candidate_dir}/"
          mv "${asset_dir}/gvisor-${arch}.tar.bz2.sha512" "${candidate_dir}/"
        done
        upstream_tag="${RELEASE_TAG%-akernel.*}"
        git fetch --force --no-tags https://github.com/google/gvisor.git \
          "refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"
        git merge-base --is-ancestor "${upstream_tag}" "${GITHUB_SHA}"
        changes="$(git log --format='%H %s' "${upstream_tag}..${GITHUB_SHA}")"
        contents="$(tar -tjf "${candidate_dir}/gvisor-amd64.tar.bz2" \
          | grep -v '/$' | sort)"
        arm_contents="$(tar -tjf "${candidate_dir}/gvisor-arm64.tar.bz2" \
          | grep -v '/$' | sort)"
        test "${contents}" = "${arm_contents}"
        jq -n \
          --arg repository "${GITHUB_REPOSITORY}" \
          --arg commit "${GITHUB_SHA}" \
          --arg upstream_tag "${upstream_tag}" \
          --arg release_tag "${RELEASE_TAG}" \
          --arg workflow_run_id "${GITHUB_RUN_ID}" \
          --arg amd64_sha512 "$(cut -d ' ' -f 1 "${candidate_dir}/gvisor-amd64.tar.bz2.sha512")" \
          --arg arm64_sha512 "$(cut -d ' ' -f 1 "${candidate_dir}/gvisor-arm64.tar.bz2.sha512")" \
          --arg contents "${contents}" \
          --arg changes "${changes}" \
          '{
            schema: 3,
            repository: $repository,
            commit: $commit,
            upstream_tag: $upstream_tag,
            release_tag: $release_tag,
            workflow_run_id: $workflow_run_id,
            archives: {
              amd64: {name: "gvisor-amd64.tar.bz2", sha512: $amd64_sha512},
              arm64: {name: "gvisor-arm64.tar.bz2", sha512: $arm64_sha512}
            },
            contents: $contents,
            changes: $changes
          }' >"${candidate_dir}/manifest.json"

    - name: Upload complete candidate
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: gvisor-candidate-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/gvisor-candidate/gvisor-amd64.tar.bz2
          ${{ runner.temp }}/gvisor-candidate/gvisor-amd64.tar.bz2.sha512
          ${{ runner.temp }}/gvisor-candidate/gvisor-arm64.tar.bz2
          ${{ runner.temp }}/gvisor-candidate/gvisor-arm64.tar.bz2.sha512
          ${{ runner.temp }}/gvisor-candidate/manifest.json
        if-no-files-found: error
        compression-level: 0
        overwrite: true
        retention-days: 30

    - name: Summarize candidate
      shell: bash
      run: |
        {
          echo "### AKernel gVisor candidate"
          echo
          echo "- Run ID: ${GITHUB_RUN_ID}"
          echo "- Planned release: ${RELEASE_TAG}"
          echo "- Commit: ${GITHUB_SHA}"
          echo "- Artifact digest: ${{ steps.upload.outputs.artifact-digest }}"
          echo "- Artifact: ${{ steps.upload.outputs.artifact-url }}"
        } >>"${GITHUB_STEP_SUMMARY}"
