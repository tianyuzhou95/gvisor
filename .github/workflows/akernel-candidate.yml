name: AKernel gVisor candidate

run-name: Build candidate ${{ inputs.release_tag }}

"on":
  workflow_dispatch:
    inputs:
      release_tag:
        description: Planned AKernel gVisor release tag
        required: true
        type: string

concurrency:
  group: akernel-gvisor-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == 'develop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Validate candidate
      id: candidate
      shell: bash
      run: |
        set -euo pipefail

        if [[ ! "${RELEASE_TAG}" =~ ^release-[0-9]{8}\.[0-9]+-akernel\.[1-9][0-9]*$ ]]; then
          echo "invalid release tag: ${RELEASE_TAG}" >&2
          exit 1
        fi

        upstream_tag="${RELEASE_TAG%-akernel.*}"
        git fetch --force --no-tags https://github.com/google/gvisor.git \
          "refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"
        git merge-base --is-ancestor "${upstream_tag}" "${GITHUB_SHA}"

        if git ls-remote --exit-code --tags origin \
          "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
          echo "release tag already exists: ${RELEASE_TAG}" >&2
          exit 1
        fi

        echo "upstream_tag=${upstream_tag}" >>"${GITHUB_OUTPUT}"

    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo -E apt-get update
        sudo -E apt-get install -y binutils bzip2 make

    - name: Build release tarball
      shell: bash
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        set -euo pipefail
        bash tools/akernel-release-archive.sh build "${ARCH}" "${RUNNER_TEMP}/gvisor-candidate"
        python3 tools/akernel-candidate-manifest.py create-arch \
          "${ARCH}" "${RUNNER_TEMP}/gvisor-candidate/gvisor-${ARCH}.tar.bz2" \
          "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" "${RELEASE_TAG}" \
          "${GITHUB_RUN_ID}" \
          "${RUNNER_TEMP}/gvisor-candidate/candidate-${ARCH}.json"

    - name: Upload architecture candidate
      uses: actions/upload-artifact@v4
      with:
        name: gvisor-candidate-${{ github.run_id }}-${{ matrix.arch }}
        path: |
          ${{ runner.temp }}/gvisor-candidate/gvisor-${{ matrix.arch }}.tar.bz2
          ${{ runner.temp }}/gvisor-candidate/gvisor-${{ matrix.arch }}.tar.bz2.sha512
          ${{ runner.temp }}/gvisor-candidate/candidate-${{ matrix.arch }}.json
        if-no-files-found: error
        compression-level: 0
        overwrite: true
        retention-days: 30

  verify:
    needs: build
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Download architecture candidates
      uses: actions/download-artifact@v5
      with:
        pattern: gvisor-candidate-${{ github.run_id }}-*
        path: ${{ runner.temp }}/gvisor-candidate

    - name: Verify and describe candidate
      shell: bash
      run: |
        set -euo pipefail
        candidate_dir="${RUNNER_TEMP}/gvisor-candidate"
        for arch in amd64 arm64; do
          asset_dir="${candidate_dir}/gvisor-candidate-${GITHUB_RUN_ID}-${arch}"
          archive="${asset_dir}/gvisor-${arch}.tar.bz2"
          test -f "${archive}"
          bash tools/akernel-release-archive.sh verify "${arch}" "${archive}"
        done
        upstream_tag="${RELEASE_TAG%-akernel.*}"
        git fetch --force --no-tags https://github.com/google/gvisor.git \
          "refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"
        git merge-base --is-ancestor "${upstream_tag}" "${GITHUB_SHA}"
        python3 tools/akernel-candidate-manifest.py assemble \
          "${candidate_dir}" "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" \
          "${GITHUB_RUN_ID}" "${RUNNER_TEMP}/manifest.json"
        test "$(jq -r '.release_tag' "${RUNNER_TEMP}/manifest.json")" = \
          "${RELEASE_TAG}"

    - name: Summarize candidate
      shell: bash
      run: |
        {
          echo "### AKernel gVisor candidate"
          echo
          echo "- Run ID: ${GITHUB_RUN_ID}"
          echo "- Planned release: ${RELEASE_TAG}"
          echo "- Commit: ${GITHUB_SHA}"
          echo "- amd64 SHA-512: $(jq -r '.archives.amd64.sha512' "${RUNNER_TEMP}/manifest.json")"
          echo "- arm64 SHA-512: $(jq -r '.archives.arm64.sha512' "${RUNNER_TEMP}/manifest.json")"
          echo "- Artifacts: gvisor-candidate-${GITHUB_RUN_ID}-{amd64,arm64}"
        } >>"${GITHUB_STEP_SUMMARY}"
